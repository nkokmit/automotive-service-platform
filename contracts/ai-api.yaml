openapi: "3.1.0"
info:
  title: Automotive AI Services API
  version: "1.0.0"
  description: |
    API contracts for the AI-powered services of the Automotive Service Platform.
    Includes the LangGraph ReAct Agent and YOLOv8s-seg damage detection service.

servers:
  - url: http://localhost/api/v1
    description: Local via Nginx gateway

tags:
  - name: chat
    description: ReAct AI Agent chat endpoint
  - name: damage-detection
    description: Vehicle damage detection via YOLOv8s-seg ONNX

paths:
  # ── Agent Service ──────────────────────────────────────────────────────
  /chat:
    post:
      tags: [chat]
      summary: Send a message to the automotive AI agent
      description: |
        The ReAct agent uses 5 tools:
        - `search_car_news` – Qdrant hybrid search
        - `search_used_cars` – PostgreSQL filter
        - `check_slots` – garage availability
        - `create_booking` – appointment booking
        - `analyze_vehicle_damage` – YOLOv8s damage detection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            examples:
              search_news:
                summary: Ask about car maintenance
                value:
                  message: "Toyota Camry 2022 cần bảo dưỡng định kỳ như thế nào?"
              search_cars:
                summary: Find used cars
                value:
                  message: "Tìm xe Honda CRV đời 2021, giá dưới 1 tỷ"
              book_service:
                summary: Book a service slot
                value:
                  message: "Đặt lịch thay dầu xe tại AutoCare ngày 20/10/2026"
              analyze_image:
                summary: Detect damage from image
                value:
                  message: "Phân tích hư hỏng xe của tôi"
                  image_url: "https://example.com/my-car.jpg"
      responses:
        "200":
          description: Agent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
            text/event-stream:
              schema:
                type: string
                description: SSE stream when stream=true

  /health:
    get:
      tags: [chat]
      summary: Health check for agent-service
      responses:
        "200":
          description: Service healthy

  # ── Damage Detection Service ───────────────────────────────────────────
  /detect:
    post:
      tags: [damage-detection]
      summary: Detect vehicle damage from image URL or base64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectionRequest"
      responses:
        "200":
          description: Detection results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionResponse"

  /detect/upload:
    post:
      tags: [damage-detection]
      summary: Detect vehicle damage from uploaded image file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                conf_threshold:
                  type: number
                  default: 0.25
      responses:
        "200":
          description: Detection results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionResponse"

components:
  schemas:
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
          example: "Tìm xe Toyota Camry đời 2022 giá dưới 1.2 tỷ"
        session_id:
          type: string
          format: uuid
          description: Session ID for conversation continuity
        user_id:
          type: string
          nullable: true
        stream:
          type: boolean
          default: false
          description: Enable SSE streaming response

    ChatResponse:
      type: object
      properties:
        session_id:
          type: string
        response:
          type: string
          description: Final agent response in Vietnamese
        tool_calls:
          type: array
          items:
            type: string
          description: Names of tools invoked during this turn

    DetectionRequest:
      type: object
      properties:
        image_url:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/car-damage.jpg"
        image_base64:
          type: string
          nullable: true
          description: Base64-encoded image without data URI prefix
        conf_threshold:
          type: number
          minimum: 0.01
          maximum: 1.0
          nullable: true
          description: Override confidence threshold

    DamageRegion:
      type: object
      properties:
        class_name:
          type: string
          enum: [dent, scratch, crack, glass_damage, lamp_damage, tire_damage, rust, deformation]
        class_id:
          type: integer
        confidence:
          type: number
        bbox:
          type: array
          items:
            type: number
          description: "[x1, y1, x2, y2] normalized 0-1"
        area_ratio:
          type: number
          description: Fraction of image area covered
        severity:
          type: string
          enum: [low, medium, high]

    DetectionResponse:
      type: object
      properties:
        success:
          type: boolean
        num_detections:
          type: integer
        damages:
          type: array
          items:
            $ref: "#/components/schemas/DamageRegion"
        overall_severity:
          type: string
          enum: [none, low, medium, high, critical]
        summary:
          type: string
          description: Human-readable summary in Vietnamese
        image_width:
          type: integer
        image_height:
          type: integer
        processing_time_ms:
          type: number

