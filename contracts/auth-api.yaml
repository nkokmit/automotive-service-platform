openapi: 3.0.3
info:
  title: Auth & User Service API
  description: |
    **SKELETON** — Bản nháp contract do Thành viên 1 (Gateway owner) đề xuất.
    Thành viên 2 vui lòng review, điền chi tiết hoặc phản hồi nếu không khớp với ERD đã thiết kế.
    Mục tiêu: thống nhất schema trước khi code, tránh phải sửa Gateway sau này.
  version: 0.1.0-draft
  contact:
    name: Thành viên 2
servers:
  - url: http://localhost:8081/api/v1
    description: Local dev (direct)
  - url: http://localhost:4000/api/v1/auth
    description: Qua API Gateway
tags:
  - name: Auth
  - name: Users
  - name: Vehicles
  - name: Addresses

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: OK }

  /users/me:
    get:
      tags: [Users]
      summary: Hồ sơ user hiện tại
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    patch:
      tags: [Users]
      summary: Cập nhật hồ sơ
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /users/me/vehicles:
    get:
      tags: [Vehicles]
      summary: Danh sách xe của user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vehicle' }
    post:
      tags: [Vehicles]
      summary: Thêm xe mới
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleCreateRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }

  /users/me/addresses:
    get:
      tags: [Addresses]
      summary: Danh sách địa chỉ
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
    post:
      tags: [Addresses]
      summary: Thêm địa chỉ mới
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressCreateRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Chưa đăng nhập
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ----- TODO: TV2 review -----
    User:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        phone: { type: string, nullable: true }
        avatar: { type: string, format: uri, nullable: true }
        role:
          type: string
          enum: [CUSTOMER, GARAGE_STAFF, ADMIN]
          default: CUSTOMER
        memberSince: { type: string, format: date-time }
        loyaltyPoints: { type: integer, minimum: 0 }
        tier:
          type: string
          enum: [MEMBER, SILVER, GOLD, PLATINUM]
        # Stats (derived từ orders)
        totalOrders: { type: integer, minimum: 0 }
        totalSpentVND: { type: integer, minimum: 0 }

    UserUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string }
        avatar: { type: string, format: uri, nullable: true }

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        name: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthResponse:
      type: object
      required: [user, accessToken, refreshToken]
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: 'Access token TTL (giây)', example: 900 }

    TokenResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }

    Vehicle:
      type: object
      required: [id, plate, brand, model, year]
      properties:
        id: { type: string, format: uuid }
        plate: { type: string, example: '30A-123.45' }
        brand: { type: string, example: 'Toyota' }
        model: { type: string, example: 'Vios' }
        year: { type: integer, example: 2020 }
        color: { type: string, nullable: true }
        nickname: { type: string, nullable: true, example: 'Xe gia đình' }
        isDefault: { type: boolean, default: false }

    VehicleCreateRequest:
      type: object
      required: [plate, brand, model, year]
      properties:
        plate: { type: string }
        brand: { type: string }
        model: { type: string }
        year: { type: integer }
        color: { type: string }
        nickname: { type: string }
        isDefault: { type: boolean, default: false }

    Address:
      type: object
      required: [id, fullAddress, recipientName, phone]
      properties:
        id: { type: string, format: uuid }
        recipientName: { type: string }
        phone: { type: string }
        fullAddress: { type: string }
        city: { type: string }
        district: { type: string }
        ward: { type: string }
        isDefault: { type: boolean, default: false }

    AddressCreateRequest:
      type: object
      required: [fullAddress, recipientName, phone]
      properties:
        recipientName: { type: string }
        phone: { type: string }
        fullAddress: { type: string }
        city: { type: string }
        district: { type: string }
        ward: { type: string }
        isDefault: { type: boolean, default: false }

    ErrorResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }
