worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;   # For image uploads

    # ── Agent Service ──────────────────────────────────────────
    upstream agent_service {
        server agent-service:8002;
    }

    # ── Damage Detection Service ───────────────────────────────
    upstream damage_service {
        server damage-detection-service:8001;
    }

    # ── Garage Service ─────────────────────────────────────────
    upstream garage_service {
        server garage-service:8000;
    }

    # ── Content Service ────────────────────────────────────────
    upstream content_service {
        server content-service:8003;
    }

    # ── Commerce Service ───────────────────────────────────────
    upstream commerce_service {
        server commerce-service:8004;
    }

    server {
        listen 80;
        server_name _;

        # ── AI Agent ──────────────────────────────────────────
        location /api/v1/chat {
            proxy_pass http://agent_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
            proxy_buffering off;   # Required for SSE streaming
        }

        # ── Damage Detection ──────────────────────────────────
        location /api/v1/detect {
            proxy_pass http://damage_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        # ── Garage / Bookings ─────────────────────────────────
        location /api/v1/garages {
            proxy_pass http://garage_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/bookings {
            proxy_pass http://garage_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Content (News) ─────────────────────────────────────
        location /api/v1/news {
            proxy_pass http://content_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Commerce (Used Cars) ──────────────────────────────
        location /api/v1/cars {
            proxy_pass http://commerce_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Health checks ─────────────────────────────────────
        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}

