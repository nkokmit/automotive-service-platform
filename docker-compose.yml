services:
  mysql:
    image: mysql:9.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-user_service}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - platform
    healthcheck:
      # TCP avoids the temporary bootstrap server; check the app's DB credentials.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  discovery-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_PATH: discovery-server
    restart: unless-stopped
    init: true
    environment:
      SERVER_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: discovery-server
    ports:
      - "${DISCOVERY_SERVER_PORT:-8761}:8761"
    networks:
      - platform
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8761/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  user-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_PATH: services/user-service
    restart: unless-stopped
    init: true
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-user_service}
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set a Base64 JWT_SECRET (at least 32 decoded bytes) in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://discovery-server:8761/eureka/}
      EUREKA_REGISTRY_FETCH_INTERVAL: ${EUREKA_REGISTRY_FETCH_INTERVAL:-10}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://localhost:8000}
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - platform
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_PATH: api-gateway
    restart: unless-stopped
    init: true
    environment:
      SERVER_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:?Set a Base64 JWT_SECRET (at least 32 decoded bytes) in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://discovery-server:8761/eureka/}
      EUREKA_REGISTRY_FETCH_INTERVAL: ${EUREKA_REGISTRY_FETCH_INTERVAL:-10}
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    depends_on:
      discovery-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - platform
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8000/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

networks:
  platform:
    driver: bridge

volumes:
  mysql-data:

