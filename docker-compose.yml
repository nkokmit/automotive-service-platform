services:
  # ── Infrastructure: MySQL ───────────────────────────────────────────────────
  mysql:
    image: mysql:9.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-user_service}
      CUSTOMER_VEHICLE_MYSQL_DATABASE: ${CUSTOMER_VEHICLE_MYSQL_DATABASE:-customer_vehicle_service}
      STAFF_MYSQL_DATABASE: ${STAFF_MYSQL_DATABASE:-staff_service}
      INVENTORY_MYSQL_DATABASE: ${INVENTORY_MYSQL_DATABASE:-inventory_service}
      BOOKING_MYSQL_DATABASE: ${BOOKING_MYSQL_DATABASE:-booking_service}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/infra/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # ── Infrastructure: Kafka (KRaft single-node) ───────────────────────────────
  kafka:
    image: apache/kafka:4.2.1
    restart: unless-stopped
    init: true
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092},PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-REd9mkeFMGNXMYId4xJDNA}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s

  # ── Infrastructure: Qdrant Vector Database (cho AI Agent) ───────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.1
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend: Discovery Server (Eureka) ──────────────────────────────────────
  discovery-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_PATH: discovery-server
    restart: unless-stopped
    init: true
    environment:
      SERVER_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: discovery-server
    ports:
      - "${DISCOVERY_SERVER_PORT:-8761}:8761"
    networks:
      - platform
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8761/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ── Backend: User Service ───────────────────────────────────────────────────
  user-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_PATH: services/user-service
    restart: unless-stopped
    init: true
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-user_service}
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set a Base64 JWT_SECRET (at least 32 decoded bytes) in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://discovery-server:8761/eureka/}
      EUREKA_REGISTRY_FETCH_INTERVAL: ${EUREKA_REGISTRY_FETCH_INTERVAL:-10}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://localhost:8000}
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - platform
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # ── Backend: Customer Vehicle Service ───────────────────────────────────────
  customer-vehicle-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_PATH: services/customer-vehicle-service
    restart: unless-stopped
    init: true
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql:3306/${CUSTOMER_VEHICLE_MYSQL_DATABASE:-customer_vehicle_service}
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set a Base64 JWT_SECRET (at least 32 decoded bytes) in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://discovery-server:8761/eureka/}
      EUREKA_REGISTRY_FETCH_INTERVAL: ${EUREKA_REGISTRY_FETCH_INTERVAL:-10}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://localhost:8000}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_CONTAINER:-kafka:19092}
    ports:
      - "${CUSTOMER_VEHICLE_SERVICE_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - platform
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  staff-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_PATH: services/staff-service
    restart: unless-stopped
    init: true
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:mysql://mysql:3306/${STAFF_MYSQL_DATABASE:-staff_service}
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set a Base64 JWT_SECRET (at least 32 decoded bytes) in .env}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://discovery-server:8761/eureka/}
      EUREKA_REGISTRY_FETCH_INTERVAL: ${EUREKA_REGISTRY_FETCH_INTERVAL:-10}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://localhost:8000}
      SCHEDULE_ZONE_ID: ${SCHEDULE_ZONE_ID:?Set SCHEDULE_ZONE_ID (IANA timezone) in .env}
    ports:
      - "${STAFF_SERVICE_PORT:-8083}:8083"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - platform
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8083/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  inventory-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_PATH: services/inventory-service
    restart: unless-stopped
    init: true
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:mysql://mysql:3306/${INVENTORY_MYSQL_DATABASE:-inventory_service}
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set a Base64 JWT_SECRET (at least 32 decoded bytes) in .env}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://discovery-server:8761/eureka/}
      EUREKA_REGISTRY_FETCH_INTERVAL: ${EUREKA_REGISTRY_FETCH_INTERVAL:-10}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://localhost:8000}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_CONTAINER:-kafka:19092}
    ports:
      - "${INVENTORY_SERVICE_PORT:-8084}:8084"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - platform
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8084/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  booking-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_PATH: services/booking-service
    restart: unless-stopped
    init: true
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:mysql://mysql:3306/${BOOKING_MYSQL_DATABASE:-booking_service}
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set a Base64 JWT_SECRET (at least 32 decoded bytes) in .env}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://discovery-server:8761/eureka/}
      EUREKA_REGISTRY_FETCH_INTERVAL: ${EUREKA_REGISTRY_FETCH_INTERVAL:-10}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://localhost:8000}
      SCHEDULE_ZONE_ID: ${SCHEDULE_ZONE_ID:-Asia/Ho_Chi_Minh}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_CONTAINER:-kafka:19092}
    ports:
      - "${BOOKING_SERVICE_PORT:-8085}:8085"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - platform
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8085/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # ── Backend: Spring Cloud API Gateway ───────────────────────────────────────
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_PATH: api-gateway
    restart: unless-stopped
    init: true
    environment:
      SERVER_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:?Set a Base64 JWT_SECRET (at least 32 decoded bytes) in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://discovery-server:8761/eureka/}
      EUREKA_REGISTRY_FETCH_INTERVAL: ${EUREKA_REGISTRY_FETCH_INTERVAL:-10}
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    depends_on:
      discovery-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      customer-vehicle-service:
        condition: service_healthy
      staff-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    networks:
      - platform
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8000/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ── AI Service: Vehicle Damage Detection (YOLOv8s ONNX) ─────────────────────
  damage-detection-service:
    build:
      context: ./ai-services/damage-detection-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ONNX_MODEL_PATH: /models/yolov8s-seg.onnx
      CONF_THRESHOLD: ${CONF_THRESHOLD:-0.25}
      IOU_THRESHOLD: ${IOU_THRESHOLD:-0.45}
    volumes:
      - ./ai-services/damage-detection-service/app/models:/models:ro
    ports:
      - "${DAMAGE_SERVICE_PORT:-8001}:8001"
    networks:
      - platform
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── AI Service: LangGraph ReAct Agent ───────────────────────────────────────
  agent-service:
    build:
      context: ./ai-services/agent-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      QDRANT_URL: http://qdrant:6333
      DAMAGE_SERVICE_URL: http://damage-detection-service:8001
      API_GATEWAY_URL: http://api-gateway:8000
      GARAGE_SERVICE_URL: http://api-gateway:8000
    ports:
      - "${AGENT_SERVICE_PORT:-8002}:8002"
    depends_on:
      qdrant:
        condition: service_healthy
      damage-detection-service:
        condition: service_healthy
    networks:
      - platform
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/v1/health')"]
      interval: 15s
      timeout: 10s
      retries: 5

networks:
  platform:
    driver: bridge

volumes:
  mysql-data:
  kafka-data:
  qdrant-data:
  onnx-models:
