version: "3.9"

# ════════════════════════════════════════════════════════════════
# Automotive Service Platform – Docker Compose
# Services: PostgreSQL, Qdrant, agent-service, damage-detection
#           garage-service, content-service, commerce-service
# ════════════════════════════════════════════════════════════════

x-common-env: &common-env
  TZ: Asia/Ho_Chi_Minh

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  qdrant-data:
  onnx-models:

services:
  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      <<: *common-env
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: automotive
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks: [app-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.1
    environment:
      <<: *common-env
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    networks: [app-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── AI Services ─────────────────────────────────────────────
  agent-service:
    build:
      context: ./ai-services/agent-service
      dockerfile: Dockerfile
    env_file: ./ai-services/agent-service/.env.example
    environment:
      <<: *common-env
      POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@postgres:5432/automotive
      QDRANT_URL: http://qdrant:6333
      GARAGE_SERVICE_URL: http://garage-service:8000
      DAMAGE_SERVICE_URL: http://damage-detection-service:8001
    ports:
      - "8002:8002"
    networks: [app-network]
    depends_on:
      postgres: { condition: service_healthy }
      qdrant:   { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  damage-detection-service:
    build:
      context: ./ai-services/damage-detection-service
      dockerfile: Dockerfile
    env_file: ./ai-services/damage-detection-service/.env.example
    environment:
      <<: *common-env
      ONNX_MODEL_PATH: /models/yolov8s-seg.onnx
    volumes:
      # Mount your exported ONNX model here:
      # docker run -v /path/to/your/yolov8s-seg.onnx:/models/yolov8s-seg.onnx ...
      - onnx-models:/models
    ports:
      - "8001:8001"
    networks: [app-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Backend Services ─────────────────────────────────────────
  garage-service:
    build:
      context: ./services/garage-service
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@postgres:5432/automotive
    ports:
      - "8000:8000"
    networks: [app-network]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  content-service:
    build:
      context: ./services/content-service
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@postgres:5432/automotive
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8003:8003"
    networks: [app-network]
    depends_on:
      postgres: { condition: service_healthy }
      qdrant:   { condition: service_healthy }
    restart: unless-stopped

  commerce-service:
    build:
      context: ./services/commerce-service
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@postgres:5432/automotive
    ports:
      - "8004:8004"
    networks: [app-network]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ── Gateway ──────────────────────────────────────────────────
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks: [app-network]
    depends_on:
      - agent-service
      - damage-detection-service
      - garage-service
    restart: unless-stopped

