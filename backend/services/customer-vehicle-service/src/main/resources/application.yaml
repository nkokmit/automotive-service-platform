server:
  port: ${SERVER_PORT:8082}

app:
  api-gateway-url: ${API_GATEWAY_URL:http://localhost:8000}

spring:
  application:
    name: customer-vehicle-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/customer_vehicle_service}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      # Broker có thể chưa sẵn sàng lúc app khởi động; không fail startup.
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:customer-vehicle-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer để payload hỏng/deserialize lỗi không làm chết
      # consumer; lỗi được giao cho handler/DLT của listener.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # Chặn deserialization type ngoài allowlist. Khi có event thật từ service
        # khác (vd work-order-service) cần thêm package của producer vào đây.
        spring.json.trusted.packages: com.example.customer_vehicle_service
        spring.json.use.type.headers: true
    listener:
      # Thiếu topic không được làm sập app (topic sẽ được tạo khi producer ghi).
      missing-topics-fatal: false

# Service discovery
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL:10}
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH:true}
  instance:
    prefer-ip-address: true

# Logging
logging:
  level:
    root: INFO
    com.example.customer_vehicle_service: ${APP_LOG_LEVEL:INFO}
    org.hibernate: ${HIBERNATE_LOG_LEVEL:INFO}
    org.springframework.orm.jpa: ${JPA_LOG_LEVEL:INFO}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# Readiness is application availability, not aggregate DB/Eureka health.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
