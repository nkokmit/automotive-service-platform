server:
  port: ${SERVER_PORT:8085}

app:
  api-gateway-url: ${API_GATEWAY_URL:http://localhost:8000}
  schedule-zone-id: ${SCHEDULE_ZONE_ID:Asia/Ho_Chi_Minh}

spring:
  application:
    name: booking-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        "[spring.json.add.type.headers]": false
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:booking-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.example.booking_service,com.example.workorder.messaging
    listener:
      missing-topics-fatal: false

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/booking_service}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL:10}
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH:true}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.booking_service: ${APP_LOG_LEVEL:INFO}
    org.hibernate: ${HIBERNATE_LOG_LEVEL:INFO}
    org.springframework.orm.jpa: ${JPA_LOG_LEVEL:INFO}
