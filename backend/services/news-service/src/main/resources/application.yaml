server:
  port: ${SERVER_PORT:8089}

app:
  api-gateway-url: ${API_GATEWAY_URL:http://localhost:8000}
  # Kho lưu ảnh bài viết. Trong Docker Compose, thư mục này được mount thành
  # volume `news-uploads` để ảnh còn tồn tại sau khi container restart.
  image-storage:
    directory: ${NEWS_IMAGE_STORAGE_DIR:/app/uploads}
    max-size-bytes: ${NEWS_IMAGE_MAX_SIZE_BYTES:5242880}
    public-base-path: /api/news-images

spring:
  application:
    name: news-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/news_service}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      # Giới hạn dung lượng ảnh tải lên cho bài viết.
      max-file-size: ${NEWS_IMAGE_MAX_FILE_SIZE:5MB}
      max-request-size: ${NEWS_IMAGE_MAX_REQUEST_SIZE:6MB}

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL:10}
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH:true}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.news_service: ${APP_LOG_LEVEL:INFO}
