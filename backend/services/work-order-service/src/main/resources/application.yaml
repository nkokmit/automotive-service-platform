server:
  port: ${SERVER_PORT:8086}

app:
  api-gateway-url: ${API_GATEWAY_URL:http://localhost:8000}
  integration:
    booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8085}
    customer-vehicle-service-url: ${CUSTOMER_VEHICLE_SERVICE_URL:http://localhost:8082}
    inventory-service-url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
    staff-service-url: ${STAFF_SERVICE_URL:http://localhost:8083}
  kafka:
    consumer:
      retry-interval-ms: ${KAFKA_CONSUMER_RETRY_INTERVAL_MS:1000}
      max-retries: ${KAFKA_CONSUMER_MAX_RETRIES:10}
    topics:
      vehicle-checked-in: ${VEHICLE_CHECKED_IN_TOPIC:vehicle-checked-in}
      parts-reservation-requested: ${PARTS_RESERVATION_REQUESTED_TOPIC:parts-reservation-requested}
      parts-reserved: ${PARTS_RESERVED_TOPIC:parts-reserved}
      parts-reservation-failed: ${PARTS_RESERVATION_FAILED_TOPIC:parts-reservation-failed}
      work-order-completed: ${WORK_ORDER_COMPLETED_TOPIC:work-order-completed}

spring:
  application:
    name: work-order-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        "[spring.json.add.type.headers]": false
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:work-order-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.example.work_order_service.messaging.event
    listener:
      missing-topics-fatal: false

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/work_order_service}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT_MS:2000}
            read-timeout: ${FEIGN_READ_TIMEOUT_MS:5000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL:10}
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH:true}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.work_order_service: ${APP_LOG_LEVEL:INFO}
    org.hibernate: ${HIBERNATE_LOG_LEVEL:INFO}
    org.springframework.orm.jpa: ${JPA_LOG_LEVEL:INFO}
